<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광고 제거</title>
  <style>
    body {
      font-family: sans-serif;
      width: 180px;
      margin: 12px;
    }
    .toggle-btn {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      margin-bottom: 6px;
    }
    .toggle-btn.off {
      background-color: #888;
    }
    .label {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
    }
    #status, #status-rcnt {
      margin-top: 4px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 13px;
      color: #333;
    }
    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="label">광고 차단 (일반)</div>
  <button id="toggle" class="toggle-btn">비활성화</button>
  <div id="status">현재 상태: 활성화됨</div>
  <hr>
  <div class="label">구글 검색 AI개요 차단</div>
  <button id="toggle-rcnt" class="toggle-btn">비활성화</button>
  <div id="status-rcnt">현재 상태: 활성화됨</div>

  <script src="popup.js"></script>
</body>
</html>
